name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar_ext: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            sidecar_ext: ''
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            sidecar_ext: ''

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Auto-sync version from tag to all config files
      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          # tauri.conf.json
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          # pyproject.toml
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          # frontend/package.json
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" frontend/package.json
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # === Frontend ===
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      # === Python sidecar ===
      - uses: astral-sh/setup-uv@v5

      - name: Build Python sidecar
        shell: bash
        run: |
          uv sync --extra build
          uv run pyinstaller --onefile --noconsole \
            --name whisper-backend${{ matrix.sidecar_ext }} \
            --hidden-import=whisper_cli \
            --hidden-import=whisper_cli.__main__ \
            --hidden-import=whisper_cli.server \
            --hidden-import=whisper_cli.transcriber \
            --hidden-import=uvicorn \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.loops \
            --hidden-import=uvicorn.loops.auto \
            --hidden-import=uvicorn.protocols \
            --hidden-import=uvicorn.protocols.http \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=uvicorn.protocols.websockets \
            --hidden-import=uvicorn.protocols.websockets.auto \
            --hidden-import=uvicorn.lifespan \
            --hidden-import=uvicorn.lifespan.on \
            --hidden-import=python_multipart \
            src/whisper_cli/__main__.py

      - name: Place sidecar binary
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp dist/whisper-backend${{ matrix.sidecar_ext }} "src-tauri/binaries/whisper-backend-${{ matrix.target }}${{ matrix.sidecar_ext }}"

      # === Rust / Tauri ===
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache tauri-cli
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ runner.os }}-2

      - name: Install tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: cargo tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'Whisper ${{ github.ref_name }}'
          releaseBody: 'Whisper 语音转文字桌面客户端'
          releaseDraft: false
          prerelease: false
