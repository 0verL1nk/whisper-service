name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar_ext: .exe
            rust_target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            sidecar_ext: .exe
            rust_target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
            sidecar_ext: ''
            rust_target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
            sidecar_ext: ''
            rust_target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            sidecar_ext: ''
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            sidecar_ext: ''
            rust_target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # === Frontend ===
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      # === Python sidecar ===
      - uses: astral-sh/setup-uv@v5

      - name: Build Python sidecar
        shell: bash
        run: |
          uv sync
          uv run pip install pyinstaller
          uv run pyinstaller --onefile \
            --name whisper-backend${{ matrix.sidecar_ext }} \
            --hidden-import=whisper_cli \
            --hidden-import=whisper_cli.server \
            --hidden-import=whisper_cli.transcriber \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.loops.auto \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=uvicorn.protocols.websockets.auto \
            --hidden-import=uvicorn.lifespan.on \
            src/whisper_cli/__main__.py

      - name: Place sidecar binary
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp dist/whisper-backend${{ matrix.sidecar_ext }} "src-tauri/binaries/whisper-backend-${{ matrix.target }}${{ matrix.sidecar_ext }}"

      # === Rust / Tauri ===
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ runner.os }}-2

      - name: Install tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: cargo tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: 'Whisper ${{ github.ref_name }}'
          releaseBody: 'Whisper 语音转文字桌面客户端'
          releaseDraft: true
          prerelease: false
