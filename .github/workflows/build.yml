name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar_ext: .exe
            artifact_ext: .nsis.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            sidecar_ext: ''
            artifact_ext: .dmg

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" frontend/package.json

      # === Frontend ===
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      # === Python sidecar ===
      - uses: astral-sh/setup-uv@v5

      - name: Build Python sidecar
        shell: bash
        run: |
          uv sync --extra build
          uv run pyinstaller --onefile --noconsole \
            --name whisper-backend${{ matrix.sidecar_ext }} \
            --hidden-import=whisper_cli \
            --hidden-import=whisper_cli.__main__ \
            --hidden-import=whisper_cli.server \
            --hidden-import=whisper_cli.transcriber \
            --hidden-import=uvicorn \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.loops \
            --hidden-import=uvicorn.loops.auto \
            --hidden-import=uvicorn.protocols \
            --hidden-import=uvicorn.protocols.http \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=uvicorn.protocols.websockets \
            --hidden-import=uvicorn.protocols.websockets.auto \
            --hidden-import=uvicorn.lifespan \
            --hidden-import=uvicorn.lifespan.on \
            --hidden-import=python_multipart \
            src/whisper_cli/__main__.py

      - name: Place sidecar binary
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp dist/whisper-backend${{ matrix.sidecar_ext }} "src-tauri/binaries/whisper-backend-${{ matrix.target }}${{ matrix.sidecar_ext }}"

      # === Rust / Tauri ===
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: .
          tauriScript: frontend/node_modules/.bin/tauri

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whisper-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/dmg/*
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | head -20

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Whisper ${{ github.ref_name }}'
          body: 'Whisper 语音转文字桌面客户端'
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.tar.gz
            artifacts/**/*.deb
