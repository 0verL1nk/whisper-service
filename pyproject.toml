[project]
name = "whisper-cli"
version = "0.1.0"
description = "Whisper 语音转文字 CLI 工具"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.18",
]

[project.scripts]
whisper = "whisper_cli.cli:main"

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.34"]
build = ["pyinstaller>=6.0"]
dev = ["ruff>=0.11", "pyright>=1.1"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whisper_cli"]
