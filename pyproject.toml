[project]
name = "whisper-cli"
version = "0.1.0"
description = "Whisper 语音转文字 CLI 工具"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
whisper = "whisper_cli.cli:main"

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.34"]
build = ["pyinstaller>=6.0"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whisper_cli"]
